name: Deploy Gaius GitHub Pages
run-name: Deploy Gaius Pages [${{ inputs.release_token || github.sha }}]

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - relay-nodes.json
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      release_token:
        description: Unique token binding a release publish to this Pages run
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
